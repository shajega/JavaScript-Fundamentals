<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="myCanvas" width="800" height="600"></canvas>
    <input type="color" id="colorPicker" value="#000000">
    <input type="range" id="sizeSlider" min="10" max="100" value="30">

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        let circle ={x:250, y:250, radius:30, color:'#000000'}

        function drawCircle(){
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI*2);
            ctx.fillStyle = circle.color;
            ctx.fill()
        }

        drawCircle()

        document.getElementById('colorPicker').addEventListener('change', function(e){
            circle.color = e.target.value;
            drawCircle();
        });

        document.getElementById('sizeSlider').addEventListener('input', function(e){
            circle.radius = e.target.value;
            drawCircle();
        })

    </script>
</body>
</html>
